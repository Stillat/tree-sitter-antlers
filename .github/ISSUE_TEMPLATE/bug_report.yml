name: Report a parser bug
description: Report an incorrect syntax tree, parse error, crash, or severe performance problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Antlers grammar. Please provide the
        smallest template that still reproduces the parser problem.

        If the syntax tree is correct but a downstream editor or tool behaves
        incorrectly, report the problem to that integration's maintainers.
        Report suspected security vulnerabilities privately as described in
        `SECURITY.md`.

  - type: textarea
    id: template
    attributes:
      label: Minimal Antlers template
      description: Remove application-specific content while preserving the problem.
      render: html
    validations:
      required: true

  - type: textarea
    id: actual-tree
    attributes:
      label: Actual syntax tree or error
      description: Include the relevant output from `npx tree-sitter parse <file>`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected-tree
    attributes:
      label: Expected syntax tree
      description: Describe or show how the template should be represented.
      render: text
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include any edits or command sequence needed to trigger the problem.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Node.js version, Tree-sitter CLI version, and grammar revision.
      render: text
      placeholder: |
        OS: Windows 11
        Node.js: 22.x
        tree-sitter: 0.25.8
        tree-sitter-antlers revision: <commit SHA>
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this parser problem.
          required: true
        - label: I confirmed this is a syntax-tree problem rather than solely a downstream integration problem.
          required: true
